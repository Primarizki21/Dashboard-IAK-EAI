[project]
name = "iak-dashboard"
version = "0.1.0"
description = "Data-Level EAI Mining Analytics Dashboard & Heterogeneous ETL Pipeline"
readme = "README.md"
authors = [
    { name = "kappa", email = "primarizkiahmad.h@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
iak-dashboard = "iak_dashboard:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
